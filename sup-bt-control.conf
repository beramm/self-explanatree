[program:bluetooth-control]
command=/home/pi/Project/led-control/.venv/bin/python -u /home/pi/Project/led-control/coba-serial.py 
directory=/home/pi/Project/led-control
autostart=true
autorestart=true
stderr_logfile=/var/log/bluetooth_control.err.log
stdout_logfile=/var/log/bluetooth_control.out.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED=1
user=root